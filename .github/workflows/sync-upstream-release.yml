name: Sync Upstream Release

# Automatically check for new upstream releases and build signed macOS packages
on:
  # Run daily at 6:00 AM UTC
  schedule:
    - cron: '0 6 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force build a specific version (e.g., v13.3.0). Leave empty to auto-detect latest.'
        required: false
        default: ''
      skip_notarization:
        description: 'Skip notarization (useful if Apple service is slow/down)'
        required: false
        type: boolean
        default: false

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: flameshot-org/flameshot

jobs:
  check-upstream:
    name: Check for new upstream release
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.check.outputs.new_release }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check for new upstream release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the version to build (either forced or latest from upstream)
          if [ -n "${{ github.event.inputs.force_version }}" ]; then
            UPSTREAM_TAG="${{ github.event.inputs.force_version }}"
            echo "Using forced version: $UPSTREAM_TAG"
          else
            # Get latest release tag from upstream
            UPSTREAM_TAG=$(gh release view --repo ${{ env.UPSTREAM_REPO }} --json tagName -q '.tagName')
            echo "Latest upstream release: $UPSTREAM_TAG"
          fi
          
          # Our signed release tag format: v13.3.0 -> v13.3.0-b-signed
          RELEASE_TAG="${UPSTREAM_TAG}-b-signed"
          
          echo "upstream_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          
          # Check if we already have this release
          if gh release view "$RELEASE_TAG" --repo ${{ github.repository }} &>/dev/null; then
            echo "Release $RELEASE_TAG already exists. Skipping build."
            echo "new_release=false" >> $GITHUB_OUTPUT
          else
            echo "New release detected! Will build $RELEASE_TAG"
            echo "new_release=true" >> $GITHUB_OUTPUT
          fi

  build-macos:
    name: Build dmg on ${{ matrix.dist.os }} ${{ matrix.dist.arch }}
    needs: check-upstream
    if: needs.check-upstream.outputs.new_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        dist:
          - { os: macos-14, arch: arm64 }
          - { os: macos-13, arch: intel }
    runs-on: ${{ matrix.dist.os }}
    env:
      APP_NAME: flameshot
      DIR_BUILD: build
      UPSTREAM_TAG: ${{ needs.check-upstream.outputs.upstream_tag }}
      RELEASE_TAG: ${{ needs.check-upstream.outputs.release_tag }}
    
    steps:
      - name: Checkout upstream release tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set env & Print flameshot version
        run: |
          echo "=======FLAMESHOT VERSION========"
          echo "Upstream tag: ${{ env.UPSTREAM_TAG }}"
          echo "Release tag: ${{ env.RELEASE_TAG }}"
          echo "================================"
          # Extract version from CMakeLists.txt
          echo "VERSION=$(cat CMakeLists.txt | grep 'set.*(.*FLAMESHOT_VERSION' | sed 's/[^0-9.]*//' | sed 's/)//g')" >> $GITHUB_ENV

      - name: Install Qt
        run: brew install qt@6

      - name: Configure
        run: |
          rm -rf "${DIR_BUILD}"/src/flameshot.dmg "${DIR_BUILD}"/src/flameshot.app/
          cmake -GNinja -S . -B "${DIR_BUILD}" -DQt6_DIR=$(brew --prefix qt6)/lib/cmake/Qt6 -DUSE_MONOCHROME_ICON=True

      - name: Compile
        run: cmake --build "${DIR_BUILD}"

      # ══════════════════════════════════════════════════════════════════════
      # BUNDLE DEPENDENCIES (CRITICAL: upstream repo doesn't include this!)
      # macdeployqt bundles Qt frameworks and their dependencies (brotli, etc.)
      # into the app bundle so it can run standalone
      # ══════════════════════════════════════════════════════════════════════
      
      - name: Deploy Qt Dependencies (macdeployqt)
        run: |
          # Find macdeployqt from the installed Qt
          MACDEPLOYQT=$(brew --prefix qt6)/bin/macdeployqt
          
          if [ ! -f "$MACDEPLOYQT" ]; then
            echo "❌ macdeployqt not found at $MACDEPLOYQT"
            exit 1
          fi
          
          echo "📦 Running macdeployqt to bundle Qt frameworks and dependencies..."
          $MACDEPLOYQT "${DIR_BUILD}/src/${APP_NAME}.app" -verbose=2
          
          echo "✅ Qt dependencies deployed successfully"
          
          # List frameworks to verify bundling
          echo "📋 Bundled frameworks:"
          ls -la "${DIR_BUILD}/src/${APP_NAME}.app/Contents/Frameworks/" || true

      # ══════════════════════════════════════════════════════════════════════
      # CODE SIGNING STEPS
      # ══════════════════════════════════════════════════════════════════════
      
      - name: Import Code Signing Certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          # List available signing identities (for debugging)
          security find-identity -v -p codesigning

      - name: Code Sign Application
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          codesign --deep --force --verify --verbose \
            --sign "$MACOS_SIGNING_IDENTITY" \
            --options runtime \
            --timestamp \
            "${DIR_BUILD}/src/${APP_NAME}.app"
          # Verify signature
          codesign --verify --verbose=4 "${DIR_BUILD}/src/${APP_NAME}.app"

      # ══════════════════════════════════════════════════════════════════════
      # BUILD DMG PACKAGE
      # Upstream repo doesn't have create_dmg CMake target, so we build manually
      # ══════════════════════════════════════════════════════════════════════
      
      - name: Build DMG package
        run: |
          APP_PATH="${DIR_BUILD}/src/${APP_NAME}.app"
          DMG_PATH="${DIR_BUILD}/src/Flameshot-${{ env.VERSION }}.dmg"
          
          echo "📦 Creating DMG from: $APP_PATH"
          echo "📦 Output DMG: $DMG_PATH"
          
          # Remove any existing DMG
          rm -f "$DMG_PATH"
          
          # Create temp directory for DMG contents
          TEMP_DIR=$(mktemp -d)
          echo "Using temp directory: $TEMP_DIR"
          
          # Copy app bundle to temp directory
          cp -R "$APP_PATH" "$TEMP_DIR/"
          
          # Create Applications symlink for drag-to-install
          ln -s /Applications "$TEMP_DIR/Applications"
          
          # Calculate size needed (add padding)
          SIZE=$(du -sk "$TEMP_DIR" | cut -f1)
          SIZE=$((SIZE + 10000))  # Add padding for DMG overhead
          
          echo "Creating DMG with size: ${SIZE}k"
          
          # Create compressed DMG
          hdiutil create -srcfolder "$TEMP_DIR" \
              -volname "Flameshot" \
              -fs HFS+ \
              -fsargs "-c c=64,a=16,e=16" \
              -format UDZO \
              -size ${SIZE}k \
              "$DMG_PATH"
          
          # Cleanup temp directory
          rm -rf "$TEMP_DIR"
          
          echo "✅ DMG created: $DMG_PATH"
          ls -la "$DMG_PATH"

      - name: Code Sign DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          codesign --force --verify --verbose \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "${DIR_BUILD}/src/Flameshot-${{ env.VERSION }}.dmg"
          # Verify DMG signature
          codesign --verify --verbose=4 "${DIR_BUILD}/src/Flameshot-${{ env.VERSION }}.dmg"

      # ══════════════════════════════════════════════════════════════════════
      # NOTARIZE DMG (submit-then-poll approach for better timeout control)
      # Based on: https://developer.apple.com/documentation/security/customizing-the-notarization-workflow
      # ══════════════════════════════════════════════════════════════════════
      - name: Notarize DMG
        id: notarize_dmg
        if: ${{ github.event.inputs.skip_notarization != 'true' }}
        continue-on-error: true
        timeout-minutes: 45
        env:
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PWD: ${{ secrets.MACOS_NOTARIZATION_PWD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          DMG_PATH="${DIR_BUILD}/src/Flameshot-${{ env.VERSION }}.dmg"
          
          # ─────────────────────────────────────────────────────────────────
          # Step 1: Submit for notarization (returns immediately)
          # ─────────────────────────────────────────────────────────────────
          echo "📤 Submitting DMG for notarization..."
          
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
            --password "$MACOS_NOTARIZATION_PWD" \
            --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
            --output-format json 2>&1)
          
          echo "Submit response: $SUBMIT_OUTPUT"
          
          # Extract submission ID from JSON response
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep -o '"id"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | sed 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
          
          if [ -z "$SUBMISSION_ID" ]; then
            echo "❌ Failed to get submission ID"
            exit 1
          fi
          
          echo "✅ Submission ID: $SUBMISSION_ID"
          
          # ─────────────────────────────────────────────────────────────────
          # Step 2: Poll for completion (with controlled intervals)
          # ─────────────────────────────────────────────────────────────────
          echo "⏳ Polling for notarization status..."
          
          MAX_ATTEMPTS=60        # Max polling attempts
          POLL_INTERVAL=30       # Seconds between polls
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Poll attempt $ATTEMPT/$MAX_ATTEMPTS..."
            
            # Get status using notarytool info
            STATUS_OUTPUT=$(xcrun notarytool info "$SUBMISSION_ID" \
              --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
              --password "$MACOS_NOTARIZATION_PWD" \
              --team-id "$MACOS_NOTARIZATION_TEAM_ID" 2>&1)
            
            echo "$STATUS_OUTPUT"
            
            # Check status
            if echo "$STATUS_OUTPUT" | grep -q "status: Accepted"; then
              echo "✅ Notarization ACCEPTED!"
              break
            elif echo "$STATUS_OUTPUT" | grep -q "status: Invalid"; then
              echo "❌ Notarization INVALID - fetching log..."
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
                --password "$MACOS_NOTARIZATION_PWD" \
                --team-id "$MACOS_NOTARIZATION_TEAM_ID"
              exit 1
            elif echo "$STATUS_OUTPUT" | grep -q "status: Rejected"; then
              echo "❌ Notarization REJECTED - fetching log..."
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
                --password "$MACOS_NOTARIZATION_PWD" \
                --team-id "$MACOS_NOTARIZATION_TEAM_ID"
              exit 1
            fi
            
            # Still in progress, wait before next poll
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Status: In Progress - waiting ${POLL_INTERVAL}s..."
              sleep $POLL_INTERVAL
            fi
          done
          
          # Check if we timed out
          if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
            echo "⏰ Timeout waiting for notarization after $((MAX_ATTEMPTS * POLL_INTERVAL / 60)) minutes"
            exit 1
          fi
          
          # ─────────────────────────────────────────────────────────────────
          # Step 3: Staple the notarization ticket
          # ─────────────────────────────────────────────────────────────────
          echo "📎 Stapling notarization ticket to DMG..."
          xcrun stapler staple "$DMG_PATH"
          
          echo "🔍 Verifying notarization..."
          spctl --assess --type open --context context:primary-signature -v "$DMG_PATH"
          
          echo "✅ Notarization complete!"

      # ══════════════════════════════════════════════════════════════════════
      # CHECK NOTARIZATION STATUS AND SET RELEASE NOTES
      # ══════════════════════════════════════════════════════════════════════
      - name: Set Notarization Status
        id: notarization_status
        run: |
          if [ "${{ steps.notarize_dmg.outcome }}" == "success" ]; then
            echo "NOTARIZED=true" >> $GITHUB_ENV
            echo "NOTARIZE_STATUS=✅ Notarized by Apple (no Gatekeeper warnings)" >> $GITHUB_ENV
            echo "✅ DMG notarization successful"
          elif [ "${{ steps.notarize_dmg.outcome }}" == "skipped" ]; then
            echo "NOTARIZED=false" >> $GITHUB_ENV
            echo "NOTARIZE_STATUS=⏭️ Notarization skipped (manual override)" >> $GITHUB_ENV
            echo "⏭️ Notarization was skipped by user request"
          else
            echo "NOTARIZED=false" >> $GITHUB_ENV
            echo "NOTARIZE_STATUS=⚠️ Notarization failed - users may see Gatekeeper warning" >> $GITHUB_ENV
            echo "⚠️ DMG notarization failed or timed out - continuing with signed-only build"
          fi

      - name: Rename DMG for Release
        run: |
          mv "${DIR_BUILD}/src/Flameshot-${{ env.VERSION }}.dmg" \
             "${DIR_BUILD}/src/Flameshot-${{ env.VERSION }}-${{ matrix.dist.arch }}.dmg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flameshot-${{ env.RELEASE_TAG }}-macos-${{ matrix.dist.arch }}
          path: ${{ github.workspace }}/build/src/Flameshot-${{ env.VERSION }}-${{ matrix.dist.arch }}.dmg

      - name: Cleanup Keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security delete-keychain $KEYCHAIN_PATH || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Flameshot ${{ env.RELEASE_TAG }} (macOS Signed)"
          draft: false
          prerelease: false
          body: |
            ## macOS Signed Build
            
            This is a **signed** macOS build of Flameshot based on the official release **${{ env.UPSTREAM_TAG }}**.
            
            **Base version:** ${{ env.VERSION }}
            **Upstream release:** https://github.com/${{ env.UPSTREAM_REPO }}/releases/tag/${{ env.UPSTREAM_TAG }}
            
            ### Downloads
            - `Flameshot-${{ env.VERSION }}-arm64.dmg` - Apple Silicon (M1/M2/M3)
            - `Flameshot-${{ env.VERSION }}-intel.dmg` - Intel Macs
            
            ### Verification
            - ✅ Code signed with Developer ID certificate
            - ${{ env.NOTARIZE_STATUS }}
            
            ---
            *Built automatically from upstream release*
          files: |
            ${{ github.workspace }}/build/src/Flameshot-${{ env.VERSION }}-${{ matrix.dist.arch }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
